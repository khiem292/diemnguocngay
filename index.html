<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đếm ngược ngày</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101b38;color:#fff;padding:24px 16px;display:flex;justify-content:center;align-items:center}.wrap{width:100%;max-width:430px}h1{text-align:center;font-size:27px}.box{background:#1c2b50;padding:24px;border-radius:22px;border:1px solid #43577d}label{display:block;margin:18px 0 10px;font-weight:bold}.muted{color:#b6c7e7}input,button{font-size:18px;width:100%;padding:15px;border-radius:12px}input{background:#f8fbff;color:#15213d;border:0;min-height:56px}button{background:#568bff;color:#fff;font-weight:bold;border:0;margin-top:16px;cursor:pointer}.result{text-align:center;background:#152443;border-radius:18px;padding:22px 10px;margin-top:22px}#number{font-size:76px;font-weight:800;color:#8bb7ff;overflow-wrap:anywhere}#message{line-height:1.5}.tip{font-size:13px;color:#b6c7e7;text-align:center;line-height:1.5;margin-top:20px}</style></head><body><main class="wrap"><h1>📅 Đếm ngược ngày</h1><div class="box"><div class="muted">Hôm nay: <strong id="today">Đang tải...</strong></div><label for="target">Chọn ngày muốn tính</label><input id="target" type="date"><button type="button" id="start" onclick="calculateDays()">▶ Bắt đầu tính</button><div class="result" aria-live="polite"><div id="heading">Số ngày còn lại</div><div id="number">—</div><div id="message">Hãy chọn ngày rồi bấm Bắt đầu tính.</div></div></div><p class="tip" id="help">Lưu ý: Hãy mở file bằng Safari hoặc Chrome. Trình xem trước tệp có thể không chạy JavaScript.</p><script>
(function(){function two(n){return n<10?'0'+n:''+n}function todayKey(){var d=new Date();return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}var today=document.getElementById('today');var d=new Date();today.textContent=two(d.getDate())+'/'+two(d.getMonth()+1)+'/'+d.getFullYear();try{var saved=localStorage.getItem('countdownTarget');if(saved)document.getElementById('target').value=saved}catch(e){}window.calculateDays=function(){var value=document.getElementById('target').value;var heading=document.getElementById('heading');var number=document.getElementById('number');var message=document.getElementById('message');if(!value){heading.textContent='Chưa chọn ngày';number.textContent='—';message.textContent='Vui lòng chọn một ngày ở trên.';return}var p=value.split('-');if(p.length!==3){message.textContent='Ngày không hợp lệ. Vui lòng chọn lại.';return}var selected=Date.UTC(Number(p[0]),Number(p[1])-1,Number(p[2]));var now=new Date();var current=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());var diff=Math.round((selected-current)/86400000);var n=Math.abs(diff);heading.textContent=diff>0?'Còn lại':diff<0?'Đã qua':'Đúng ngày hôm nay';number.textContent=String(n);message.textContent=diff===0?'🎉 Hôm nay chính là ngày bạn chọn!':Math.floor(n/7)+' tuần '+n%7+' ngày';try{localStorage.setItem('countdownTarget',value)}catch(e){}};document.getElementById('start').addEventListener('click',window.calculateDays);document.getElementById('target').addEventListener('change',window.calculateDays);if(document.getElementById('target').value)window.calculateDays();setInterval(function(){var d=new Date();var text=two(d.getDate())+'/'+two(d.getMonth()+1)+'/'+d.getFullYear();if(today.textContent!==text){today.textContent=text;if(document.getElementById('target').value)window.calculateDays()}},60000)})();
</script></main></body></html>
